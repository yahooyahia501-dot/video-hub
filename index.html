<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VAULT</title>
<style>
:root{--bg:#0a0a0b;--card:#141416;--line:#232327;--fg:#e9e9ea;--amber:#e0a94a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial}
header{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,11,.92);backdrop-filter:blur(6px);z-index:5}
.brand{font-weight:800;letter-spacing:2px;color:var(--amber)}
header input,header select{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:8px;border-radius:8px}
header input{flex:1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{position:relative;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer}
.card:hover{border-color:var(--amber)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.card .dur{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);font-size:12px;padding:2px 6px;border-radius:6px}
.card .tt{padding:8px;font-size:13px;color:#cfcfd2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.player{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.hidden{display:none}
.player-box{width:min(1000px,100%);position:relative}
.player-box video{width:100%;border-radius:12px;background:#000}
.close{position:absolute;top:-40px;right:0;background:0;color:#fff;border:0;font-size:22px}
.ptitle{margin-top:8px;color:#d8d8da}
</style>
</head>
<body>
<header>
  <div class="brand">VAULT</div>
  <input id="q" placeholder="ابحث...">
  <select id="sort">
    <option value="duration">الأطول مدة</option>
    <option value="added">الأحدث</option>
  </select>
</header>
<main id="grid" class="grid"></main>
<div id="player" class="player hidden">
  <div class="player-box">
    <button id="close" class="close">✕</button>
    <video id="vid" controls playsinline></video>
    <div id="ptitle" class="ptitle"></div>
  </div>
</div>

<script>
// بيانات تجريبية — بعدين السکرابر هو اللي هيملاها
const DATA = [
  {id:1, title:"عينة فيديو طويلة", duration_s:596, added_at:3,
   thumb:"https://picsum.photos/seed/v1/480/270",
   stream_url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"},
  {id:2, title:"عينة تانية", duration_s:120, added_at:2,
   thumb:"https://picsum.photos/seed/v2/480/270",
   stream_url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"},
  {id:3, title:"عينة قصيرة", duration_s:60, added_at:1,
   thumb:"https://picsum.photos/seed/v3/480/270",
   stream_url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"}
];

const grid=document.getElementById('grid'), player=document.getElementById('player'),
      vid=document.getElementById('vid'), ptitle=document.getElementById('ptitle');
const fmt=s=>{s=s||0;const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};

function render(list){
  grid.innerHTML='';
  for(const v of list){
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<img loading="lazy" src="${v.thumb}" alt="">
      <div class="dur">${fmt(v.duration_s)}</div>
      <div class="tt">${v.title}</div>`;
    d.onclick=()=>open(v); grid.appendChild(d);
  }
}
function open(v){ ptitle.textContent=v.title; vid.src=v.stream_url;
  player.classList.remove('hidden'); vid.play().catch(()=>{}); }
document.getElementById('close').onclick=()=>{vid.pause();vid.removeAttribute('src');vid.load();player.classList.add('hidden')};
function apply(){
  const q=document.getElementById('q').value.toLowerCase();
  const sort=document.getElementById('sort').value;
  let list=DATA.filter(v=>!q||v.title.toLowerCase().includes(q));
  list.sort((a,b)=> sort==='duration' ? b.duration_s-a.duration_s : b.added_at-a.added_at);
  render(list);
}
document.getElementById('q').oninput=apply;
document.getElementById('sort').onchange=apply;
apply();
</script>
</body>
</html>
